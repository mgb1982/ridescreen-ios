name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-simulator:
    name: Build for iOS Simulator
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install fontTools
        run: |
          python3 -m venv "$RUNNER_TEMP/font-check"
          "$RUNNER_TEMP/font-check/bin/python" -m pip install --upgrade pip fonttools

      - name: Decode and validate Archivo fonts
        run: |
          ./scripts/prepare-ios-fonts.sh
          "$RUNNER_TEMP/font-check/bin/python" scripts/validate-ios-fonts.py

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/RideScreenIOS.xcodeproj \
            -scheme RideScreenIOS \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests on iPhone 16 simulator
        run: |
          xcodebuild \
            -project ios/RideScreenIOS.xcodeproj \
            -scheme RideScreenIOS \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath "$RUNNER_TEMP/ios-test-build" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            test

  build-device-unsigned:
    name: Build unsigned package for physical iPhone
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install fontTools
        run: |
          python3 -m venv "$RUNNER_TEMP/font-check"
          "$RUNNER_TEMP/font-check/bin/python" -m pip install --upgrade pip fonttools

      - name: Decode and validate Archivo fonts
        run: |
          ./scripts/prepare-ios-fonts.sh
          "$RUNNER_TEMP/font-check/bin/python" scripts/validate-ios-fonts.py

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS device (unsigned)
        run: |
          xcodebuild \
            -project ios/RideScreenIOS.xcodeproj \
            -scheme RideScreenIOS \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-device-build" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/ios-device-build/Build/Products/Release-iphoneos/RideScreenIOS.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/RideScreenIOS.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/RideScreenIOS-v0.1.0-build-${{ github.run_number }}-unsigned.ipa"
          test -f "$RUNNER_TEMP/RideScreenIOS-v0.1.0-build-${{ github.run_number }}-unsigned.ipa"

      - name: Upload unsigned package
        uses: actions/upload-artifact@v4
        with:
          name: RideScreenIOS-v0.1.0-build-${{ github.run_number }}-unsigned-IPA
          path: ${{ runner.temp }}/RideScreenIOS-v0.1.0-build-${{ github.run_number }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
